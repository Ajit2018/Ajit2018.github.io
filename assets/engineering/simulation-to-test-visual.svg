<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Simulation-to-Test Correlation</title><desc id="d">Representative public-safe comparison of a simulated hotspot and an observed failure location.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f2f7fb"/></linearGradient>
 <linearGradient id="title" x1="0" x2="1"><stop stop-color="#0a3560"/><stop offset=".6" stop-color="#1376ff"/><stop offset="1" stop-color="#6b56ed"/></linearGradient>
 <radialGradient id="heat"><stop stop-color="#ff3b30"/><stop offset=".3" stop-color="#ffb234"/><stop offset=".58" stop-color="#55d95b"/><stop offset=".8" stop-color="#29c6ed"/><stop offset="1" stop-color="#3158e8"/></radialGradient>
 <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="62" y="72" font-family="Arial" font-size="18" letter-spacing="6" fill="#56718e">MODEL ↔ PHYSICAL EVIDENCE</text>
<text x="62" y="150" font-family="Arial" font-weight="700" font-size="58" fill="url(#title)">Simulation-to-Test Correlation</text>
<text x="62" y="196" font-family="Arial" font-size="27" fill="#60738a">Using analysis to explain real product behavior</text>
<g transform="translate(62 270)">
 <rect width="500" height="420" rx="28" fill="#fff" stroke="#dfe8f0" filter="url(#s)"/>
 <text x="28" y="42" font-family="Arial" font-size="17" font-weight="700" fill="#173a5b">SIMULATION RESULT</text>
 <text x="28" y="72" font-family="Arial" font-size="15" fill="#6e8196">Predicted hotspot</text>
 <g transform="translate(76 105)">
  <rect width="345" height="235" rx="34" fill="#2c3948"/>
  <rect x="35" y="35" width="275" height="165" rx="24" fill="#435264"/>
  <rect x="85" y="62" width="95" height="70" rx="12" fill="#77889a"/>
  <circle cx="205" cy="112" r="92" fill="url(#heat)" opacity=".96"/>
  <circle cx="205" cy="112" r="11" fill="#fff"/>
 </g>
 <text x="28" y="390" font-family="Arial" font-size="13" fill="#76899d">Representative hotspot illustration</text>
</g>
<g transform="translate(585 270)">
 <rect width="500" height="420" rx="28" fill="#fff" stroke="#dfe8f0" filter="url(#s)"/>
 <text x="28" y="42" font-family="Arial" font-size="17" font-weight="700" fill="#173a5b">PHYSICAL TEST RESULT</text>
 <text x="28" y="72" font-family="Arial" font-size="15" fill="#6e8196">Observed failure location</text>
 <g transform="translate(76 105)">
  <rect width="345" height="235" rx="34" fill="#2c3948"/>
  <rect x="35" y="35" width="275" height="165" rx="24" fill="#435264"/>
  <rect x="85" y="62" width="95" height="70" rx="12" fill="#77889a"/>
  <circle cx="205" cy="112" r="46" fill="#7c3e2e" opacity=".45"/>
  <circle cx="205" cy="112" r="24" fill="#40241f"/>
  <path d="M172 88 l65 50 M170 135 l70 -47" stroke="#b17a4d" stroke-width="7" opacity=".65"/>
  <circle cx="205" cy="112" r="7" fill="#fff"/>
 </g>
 <text x="28" y="390" font-family="Arial" font-size="13" fill="#76899d">Representative observed-failure illustration</text>
</g>
<g transform="translate(170 734)">
 <rect width="860" height="88" rx="22" fill="#edf5fb"/>
 <circle cx="52" cy="44" r="24" fill="#2e78f6"/><path d="M40 44 l9 9 17 -20" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
 <text x="90" y="37" font-family="Arial" font-size="18" font-weight="700" fill="#173a5b">Correlation mindset</text>
 <text x="90" y="61" font-family="Arial" font-size="15" fill="#61768b">Compare predicted location/trend with physical evidence, then use the match or mismatch to refine the design decision.</text>
</g></svg>