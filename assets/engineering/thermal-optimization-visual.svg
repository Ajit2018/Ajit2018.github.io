<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">Thermal Optimization</title><desc id="d">Representative public-safe thermal optimization illustration showing a calculated peak temperature reduction from 123 to 107 degrees Celsius.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f2f7fb"/></linearGradient>
 <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#ffb13b"/><stop offset=".55" stop-color="#ff6a3d"/><stop offset="1" stop-color="#dc254b"/></linearGradient>
 <linearGradient id="cool" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#32c4ff"/><stop offset="1" stop-color="#3765f5"/></linearGradient>
 <linearGradient id="title" x1="0" x2="1"><stop stop-color="#0a3560"/><stop offset=".55" stop-color="#1474ff"/><stop offset="1" stop-color="#7355ee"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="62" y="72" font-family="Arial" font-size="18" letter-spacing="6" fill="#56718e">ENGINEERING SIMULATION</text>
<text x="62" y="150" font-family="Arial" font-weight="700" font-size="62" fill="url(#title)">Thermal Optimization</text>
<text x="62" y="196" font-family="Arial" font-size="27" fill="#60738a">Calculated peak temperature reduced from 123°C to 107°C</text>
<!-- stylized thermal component -->
<g transform="translate(74 265)" filter="url(#s)">
 <rect x="0" y="0" width="560" height="440" rx="34" fill="#fff" stroke="#dfe8f0"/>
 <g transform="translate(125 52)">
  <path d="M50 250 L50 90 Q50 45 95 45 H260 Q305 45 305 90 V250 Q305 315 240 315 H115 Q50 315 50 250Z" fill="#273747"/>
  <rect x="102" y="164" width="150" height="105" rx="15" fill="url(#hot)"/>
  <rect x="84" y="122" width="186" height="38" rx="10" fill="#7f91a3"/>
  <g stroke="#1c2834" stroke-width="18" stroke-linecap="round">
    <path d="M72 54 v-36"/><path d="M110 49 v-39"/><path d="M150 46 v-40"/><path d="M190 46 v-40"/><path d="M230 49 v-39"/><path d="M270 54 v-36"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <path d="M135 145 C130 105 125 92 125 70" stroke="#38c3ff" stroke-width="14"/>
    <path d="M178 145 C178 108 178 92 178 64" stroke="#23b8f4" stroke-width="14"/>
    <path d="M220 145 C225 105 232 92 232 70" stroke="#2d7dfa" stroke-width="14"/>
  </g>
  <g fill="#2d7dfa"><path d="M112 72 l13-24 13 24z"/><path d="M165 66 l13-24 13 24z"/><path d="M219 72 l13-24 13 24z"/></g>
 </g>
 <text x="28" y="390" font-family="Arial" font-size="16" font-weight="700" fill="#173a5b">REPRESENTATIVE THERMAL MODEL</text>
 <text x="28" y="418" font-family="Arial" font-size="14" fill="#718397">Simplified public-safe illustration, not internal CAD or solver output.</text>
</g>
<!-- comparison -->
<g transform="translate(690 276)">
 <rect width="440" height="420" rx="28" fill="#fff" stroke="#dfe8f0" filter="url(#s)"/>
 <text x="34" y="50" font-family="Arial" font-size="19" font-weight="700" fill="#173a5b">Calculated peak temperature</text>
 <line x1="55" y1="290" x2="390" y2="290" stroke="#d8e3ec" stroke-width="2"/>
 <rect x="95" y="105" width="95" height="185" rx="16" fill="url(#hot)"/>
 <rect x="255" y="132" width="95" height="158" rx="16" fill="url(#cool)"/>
 <text x="142" y="90" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#113862">123°C</text>
 <text x="302" y="118" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#113862">107°C</text>
 <text x="142" y="325" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#5e7288">BASELINE</text>
 <text x="302" y="325" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#5e7288">SELECTED CONCEPT</text>
 <rect x="80" y="350" width="290" height="46" rx="23" fill="#eef4ff"/>
 <text x="225" y="380" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#315de5">16°C lower calculated peak</text>
</g>
<g transform="translate(70 760)">
 <rect width="1060" height="72" rx="18" fill="#edf5fb"/>
 <text x="24" y="30" font-family="Arial" font-size="16" font-weight="700" fill="#173a5b">Engineering decision:</text>
 <text x="186" y="30" font-family="Arial" font-size="16" fill="#5e7288">sensitivity analysis + correlation → compare concepts → select a lower-temperature design direction.</text>
 <text x="24" y="55" font-family="Arial" font-size="13" fill="#7a8ca0">Representative graphic based on evidence-controlled portfolio wording.</text>
</g></svg>